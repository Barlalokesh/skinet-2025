<div class="w-full">
  <mat-radio-group 
      [value]="cartService.selectedDelivery()?.id"
      (change)="updateDeliveryMethod($event.value)"
      class="grid grid-cols-2 gap-4">

    <!-- Delivery Method 1 -->
    <label class="p-3 border border-gray-200 cursor-pointer w-full h-full hover:bg-purple-100">
      <mat-radio-button 
          class="w-full h-full" 
          [value]="checkoutService.deliveryMethods[0]?.id">

        <div class="flex flex-col w-full h-full">
          <strong>{{ checkoutService.deliveryMethods[0]?.shortName }} - {{ checkoutService.deliveryMethods[0]?.price | currency }}</strong>
          <span class="text-sm">{{ checkoutService.deliveryMethods[0]?.description }}</span>
        </div>

      </mat-radio-button>
    </label>

    <!-- Delivery Method 2 -->
    <label class="p-3 border border-gray-200 cursor-pointer w-full h-full hover:bg-purple-100">
      <mat-radio-button 
          class="w-full h-full" 
          [value]="checkoutService.deliveryMethods[1]?.id">

        <div class="flex flex-col w-full h-full">
          <strong>{{ checkoutService.deliveryMethods[1]?.shortName }} - {{ checkoutService.deliveryMethods[1]?.price | currency }}</strong>
          <span class="text-sm">{{ checkoutService.deliveryMethods[1]?.description }}</span>
        </div>

      </mat-radio-button>
    </label>

    <!-- Add more methods manually if needed -->

  </mat-radio-group>
</div>
