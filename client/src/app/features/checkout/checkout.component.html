<div class="flex mt-32 gap-6">

  <!-- Main checkout steps -->
  <div class="w-3/4">
    <mat-stepper #stepper linear class="bg-white border border-gray-200 shadow-sm">

      <mat-step label="Address" [completed]="completionStatus().address">
        <div id="address-element"></div>
        <div class="flex justify-end mt-1">
          <mat-checkbox
            [checked]="saveAddress"
            (change)="onSaveAddressCheckboxChange($event)">
            save as default address
          </mat-checkbox>
        </div>
        <div class="flex justify-between mt-6">
          <button routerLink="/shop" mat-stroked-button>continue shopping</button>
          <button [disabled]="!completionStatus().address" matStepperNext mat-flat-button>Next</button>
        </div>
      </mat-step>

      <mat-step label="Shipping" [completed]="deliveryCompleted()">
        <app-checkout-delivery (deliveryComplete)="handleDeliveryChange($event)"></app-checkout-delivery>
        <div class="flex justify-between mt-6">
          <button matStepperPrevious mat-stroked-button>Back</button>
          <button [disabled]="!deliveryCompleted()" matStepperNext mat-flat-button>Next</button>
        </div>
      </mat-step>

      <mat-step label="Payment" [completed]="completionStatus().card">
        <div id="Payment-element"></div>
        <div class="flex justify-between mt-6">
          <button matStepperPrevious mat-stroked-button>Back</button>
          <button [disabled]="!completionStatus().card" matStepperNext mat-flat-button>Next</button>
        </div>
      </mat-step>

      <mat-step label="Confirmation">
        <app-checkout-review [confirmationToken]="confirmationToken"></app-checkout-review>
        <div class="flex justify-between mt-6">
          <button matStepperPrevious mat-stroked-button>Back</button>
          <button [disabled]="!confirmationToken || loading"
                  (click)="confirmPayment(stepper)"
                  mat-flat-button>
            <mat-spinner diameter="20" [hidden]="!loading"></mat-spinner>
            <span [hidden]="loading">
              Pay {{ cartService.totals()?.total | currency }}
            </span>
          </button>
        </div>
      </mat-step>

    </mat-stepper>
  </div>

  <!-- Sidebar: order summary -->
  <div class="w-1/4">
    <app-order-summary></app-order-summary>
  </div>

</div>
